name: Optimize website images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Create optimized WebP images
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for source, output, quality in (
              ('kendo.jpg', 'kendo.webp', 85),
              ('confocal.jpg', 'confocal.webp', 95),
          ):
              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image)
                  if image.mode not in ('RGB','RGBA'):
                      image = image.convert('RGB')
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  image.save(output, 'WEBP', quality=quality, method=6)
                  print(f'{source} -> {output}: {Path(output).stat().st_size} bytes')
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kendo.webp confocal.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized WebP versions of website images"
            git push
          fi
